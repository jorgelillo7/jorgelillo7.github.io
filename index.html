<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jorge Lillo · Android apps</title>
<style>
  :root { --bg: #0d1117; --panel: #161b22; --text: #e6edf3; --muted: #8b949e; --accent: #3ddc84; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  main { max-width: 720px; margin: 0 auto; padding: 64px 20px; }
  h1 { font-size: 2.4rem; margin: 0; letter-spacing: -0.02em; }
  h1 .cursor { color: var(--accent); }
  .prompt { color: var(--accent); }
  p.lead { color: var(--muted); margin-top: 8px; }
  h2 { font-size: 1rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.12em; margin-top: 48px; }
  .app { background: var(--panel); border: 1px solid #30363d; border-radius: 12px; padding: 20px; margin-top: 12px; }
  .app h3 { margin: 0 0 4px; font-size: 1.15rem; }
  .app p { margin: 0 0 12px; color: var(--muted); }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .links a { margin-right: 18px; }
  footer { margin-top: 64px; color: var(--muted); font-size: 0.85rem; }
</style>
</head>
<body>
<main>
  <h1>JL<span class="cursor">_</span></h1>
  <p class="lead"><span class="prompt">&gt;</span> building Android apps. Simple, useful, no ads.</p>

  <h2>Apps</h2>
  <div class="app">
    <h3>🎄 Christmas Countdown</h3>
    <p>Days, hours and sleeps until Christmas, with an advent calendar, widget and carols.</p>
    <div class="links">
      <a href="https://play.google.com/store/apps/details?id=com.jorgelillo.christmascountdown">Google Play</a>
      <a href="/privacy/christmas-countdown/">Privacy policy</a>
    </div>
  </div>

  <footer>Jorge Lillo · Questions? Open an issue on <a href="https://github.com/jorgelillo7/jorgelillo7.github.io/issues">GitHub</a>.</footer>
</main>
</body>
</html>
