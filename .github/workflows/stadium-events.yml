# Refreshes stadium/events.json, the feed of the "¿Hay jaleo? Metropolitano" Android app, from the
# stadium's agenda and Atlético de Madrid's fixtures. Commits only when the events change. If a page
# can't be read, the job fails and the last good file stays published.
name: Stadium events

on:
  schedule:
    - cron: "0 5 * * *"   # 06:00 in Madrid in winter, 07:00 in summer
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/stadium_events.py"
      - "scripts/test_stadium_events.py"
      - ".github/workflows/stadium-events.yml"

permissions:
  contents: write
  issues: write   # one issue listing this week's events with no kick-off time

concurrency:
  group: stadium-events
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test
        run: python3 scripts/test_stadium_events.py

      - name: Build the feed
        run: python3 scripts/stadium_events.py stadium/events.json

      - name: Publish if it changed
        if: github.event_name != 'pull_request'
        run: |
          git add stadium/events.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Stadium events: refresh the feed"
          git push

      # Opens (or updates) one issue while an event in the next 7 days has no time, and closes it
      # once none does. It never fails the job: the feed is published either way.
      - name: Flag events without a time
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$(python3 scripts/stadium_events.py --missing-times stadium/events.json)"
          title="Stadium events without a kick-off time in the next 7 days"
          number="$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')"
          if [ -n "$body" ]; then
            if [ -n "$number" ]; then
              gh issue edit "$number" --body "$body"
            else
              gh issue create --title "$title" --body "$body" --assignee "${{ github.repository_owner }}"
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --comment "Every event in the next 7 days has a time now."
          fi
